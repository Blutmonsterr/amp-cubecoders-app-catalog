    <!-- Modern Layout Override Theme (V2) -->
    <style id="modern-layout-override">
        :root {
            --bg-main: #09090b;
            --bg-card: rgba(24, 24, 27, 0.6);
            --bg-card-hover: rgba(39, 39, 42, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #39b54a;
            --primary-glow: rgba(57, 181, 74, 0.15);
            --text-light: #f4f4f5;
            --text-muted: #a1a1aa;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        /* --- Base & Scrollbar --- */
        body {
            background-color: var(--bg-main) !important;
            color: var(--text-light) !important;
            background-image: 
                radial-gradient(circle at 50% 0%, var(--primary-glow) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(155, 89, 182, 0.05) 0%, transparent 50%) !important;
            background-attachment: fixed !important;
            font-family: 'Montserrat', sans-serif !important;
            line-height: 1.6 !important;
        }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* --- Header --- */
        .page-header {
            background: transparent !important;
            backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            padding: 25px 5% !important;
            margin: 0 auto !important;
            width: 100% !important;
            max-width: 1400px !important;
            position: absolute !important; /* Scrollt mit nach oben weg = mehr Platz! */
            top: 0 !important; left: 0 !important; right: 0 !important;
            z-index: 100 !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: flex-start !important;
            gap: 15px !important;
            pointer-events: none !important; /* Erlaubt Klicks in den freien Raum dazwischen */
        }
        .nav-left, .lang-switch {
            position: relative !important;
            top: auto !important; left: auto !important; right: auto !important;
            transform: none !important;
            pointer-events: auto !important; /* Aktiviert Klicks für die Buttons */
        }
        .back-btn, .extra-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08) !important;
            padding: 8px 16px !important;
            border-radius: 30px !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(10px) !important;
            color: var(--text-light) !important;
            text-decoration: none !important;
            transition: var(--transition) !important;
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
        }
        .back-btn:hover, .extra-btn:hover {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: var(--primary) !important;
            color: #fff !important;
            box-shadow: 0 8px 25px rgba(57, 181, 74, 0.4) !important;
            transform: translateY(-2px) !important;
        }
        a[href="https://cubecoders.com/AMP"] {
            display: inline-block;
            background: transparent !important;
            padding: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            backdrop-filter: none !important;
            transition: var(--transition) !important;
            box-shadow: none !important;
            position: relative !important;
            z-index: 100 !important;
            pointer-events: auto !important;
        }
        a[href="https://cubecoders.com/AMP"]:hover {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            transform: scale(1.05) !important;
        }
        a[href="https://cubecoders.com/AMP"] img {
            border: none !important;
            max-width: 115px !important;
            display: block !important;
            transition: transform 0.3s ease !important;
            box-shadow: none !important;
        }

        /* --- Settings Dropdown & Language --- */
        .lang-switch { 
            display: flex !important; align-items: center !important; gap: 15px !important; 
            background: rgba(255, 255, 255, 0.05) !important;
            padding: 8px 16px !important;
            border-radius: 30px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
        }
        #lang-select {
            background: transparent !important;
            border: 1px solid transparent !important;
            color: var(--text-light) !important;
            padding: 4px 8px !important;
            border-radius: 8px !important;
            font-family: inherit !important;
            font-size: 0.85rem !important;
            cursor: pointer !important;
            transition: var(--transition) !important;
            outline: none !important;
        }
        #lang-select:hover { background: rgba(255, 255, 255, 0.08) !important; border-color: rgba(255, 255, 255, 0.1) !important; }
        #lang-select option { background: #18181b !important; color: #fff !important; }
        .settings-dropbtn {
            background: transparent !important; border: none !important;
            color: var(--text-muted) !important; font-size: 1.2rem !important;
            cursor: pointer !important; transition: var(--transition) !important;
        }
        .settings-dropbtn:hover { color: var(--primary) !important; transform: rotate(45deg) !important; }
        .settings-dropdown-content {
            background: rgba(24, 24, 27, 0.9) !important; backdrop-filter: blur(15px) !important;
            border: 1px solid var(--border-color) !important; border-radius: 12px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important; padding: 10px !important;
            min-width: 220px !important; right: 0 !important; left: auto !important;
        }
        .dropdown-item {
            color: var(--text-light) !important; padding: 12px !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
            display: flex !important; justify-content: space-between !important; align-items: center !important;
        }
        .dropdown-item:last-child { border-bottom: none !important; }
        .switch { position: relative !important; display: inline-block !important; width: 44px !important; min-width: 44px !important; height: 24px !important; min-height: 24px !important; margin: 0 0 0 10px !important; padding: 0 !important; flex-shrink: 0 !important; align-self: center !important; box-sizing: border-box !important; }
        .switch input { opacity: 0 !important; width: 0 !important; height: 0 !important; position: absolute !important; margin: 0 !important; padding: 0 !important; pointer-events: none !important; }
        .slider.round { border-radius: 24px !important; }
        .slider {
            position: absolute !important; cursor: pointer !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            background-color: rgba(255,255,255,0.1) !important; transition: .4s !important; border: none !important; box-sizing: border-box !important;
        }
        .slider:before {
            position: absolute !important; content: "" !important; height: 18px !important; width: 18px !important;
            left: 3px !important; top: 3px !important; bottom: auto !important; right: auto !important; margin: 0 !important; background-color: white !important; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) !important; border-radius: 50% !important; box-shadow: 0 2px 5px rgba(0,0,0,0.3) !important; box-sizing: border-box !important;
        }
        input:checked + .slider { background-color: var(--primary) !important; }
        input:checked + .slider:before { transform: translateX(20px) !important; }

        /* --- Search Section (Hero) --- */
        .search-section { max-width: 1400px !important; margin: 0 auto !important; padding: 130px 20px 100px 20px !important; animation: heroFadeIn 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) backwards !important; }
        .search-bar-container { text-align: center !important; margin-bottom: 50px !important; }
        .heading-wrapper h1 {
            font-size: 3rem !important; font-weight: 800 !important;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%) !important;
            background-clip: text !important; -webkit-background-clip: text !important; color: transparent !important; -webkit-text-fill-color: transparent !important;
            margin-bottom: 30px !important; letter-spacing: -1px !important;
        }
        .search-input-wrapper { max-width: 650px !important; margin: 0 auto 30px auto !important; position: relative !important; }
        .search-input-wrapper input {
            width: 100% !important; background: rgba(25, 25, 25, 0.6) !important;
            backdrop-filter: blur(10px) !important; border: 1px solid var(--border-color) !important;
            border-radius: 50px !important; padding: 20px 30px !important;
            font-size: 1.2rem !important; color: var(--text-light) !important;
            transition: var(--transition) !important; box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important;
        }
        .search-input-wrapper input:focus {
            border-color: var(--primary) !important; background: rgba(30, 30, 30, 0.8) !important;
            box-shadow: 0 0 0 4px rgba(57, 181, 74, 0.15), 0 10px 30px rgba(0,0,0,0.4) !important;
            outline: none !important;
        }
        #clearSearch {
            position: absolute !important; right: 25px !important; top: 50% !important;
            transform: translateY(-50%) !important; color: var(--text-muted) !important;
            cursor: pointer !important; font-size: 1.2rem !important; transition: color 0.2s !important;
        }
        #clearSearch:hover { color: #fff !important; }

        /* --- Filter Chips --- */
        .filter-chips { display: flex; justify-content: center !important; gap: 12px !important; flex-wrap: wrap !important; }
        .custom-tooltip-container { position: relative !important; overflow: visible !important; }
        .custom-tooltip-text {
            visibility: hidden; background: rgba(24, 24, 27, 0.95) !important; backdrop-filter: blur(10px) !important;
            color: #fff !important; text-align: center !important; border-radius: 12px !important; padding: 12px 16px !important;
            position: absolute !important; z-index: 1000 !important; bottom: 130% !important; left: 50% !important;
            transform: translateX(-50%) translateY(10px) !important; opacity: 0; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
            width: max-content !important; max-width: 280px !important; font-size: 0.85rem !important; font-weight: 500 !important;
            line-height: 1.5 !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
            pointer-events: none !important; text-transform: none !important; letter-spacing: normal !important; font-family: 'Montserrat', sans-serif !important;
        }
        .custom-tooltip-text::after {
            content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid;
            border-color: rgba(255, 255, 255, 0.15) transparent transparent transparent;
        }
        .custom-tooltip-container:hover .custom-tooltip-text { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0) !important; }
        .filter-chip {
            background: rgba(255, 255, 255, 0.03) !important; border: 1px solid var(--border-color) !important;
            border-radius: 30px !important; padding: 10px 24px !important; color: var(--text-muted) !important;
            font-size: 0.95rem !important; font-weight: 600 !important; transition: var(--transition) !important;
            cursor: pointer !important; backdrop-filter: blur(5px) !important;
        }
        .filter-chip:hover {
            background: rgba(255, 255, 255, 0.08) !important; color: var(--text-light) !important;
            transform: translateY(-2px) !important;
        }
        .filter-chip.active {
            background: var(--primary) !important; color: #111 !important;
            border-color: var(--primary) !important; box-shadow: 0 4px 15px rgba(57, 181, 74, 0.4) !important;
        }
        #resultCount { font-size: 0.95rem !important; color: var(--text-muted) !important; margin-top: 15px !important; font-weight: 500 !important; }

        /* --- App List (New Responsive Grid) --- */
        .app-list {
            display: grid !important; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)) !important;
            gap: 30px !important; padding: 0 !important; list-style: none !important; align-items: stretch !important;
        }
        .app-list li { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
        .list-separator { display: none !important; } /* Hide old separators */

        /* --- Animations --- */
        @keyframes cardFadeUp { 0% { opacity: 0; transform: translateY(40px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes heroFadeIn { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }

        /* --- App Cards --- */
        .app-item {
            background: var(--bg-card) !important; backdrop-filter: blur(10px) !important;
            border: 1px solid var(--border-color) !important; border-radius: var(--radius-lg) !important;
            display: flex !important; flex-direction: column !important; text-align: left !important;
            transition: var(--transition) !important; box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important;
            height: 100% !important; width: 100% !important; cursor: pointer !important; overflow: hidden !important; padding: 0 !important;
            animation: cardFadeUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) backwards !important;
        }
        .app-item:hover {
            transform: translateY(-8px) scale(1.02) !important; border-color: rgba(57, 181, 74, 0.4) !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(57,181,74,0.1) !important;
            background: var(--bg-card-hover) !important; z-index: 2 !important;
        }
        .image-container {
            width: 100% !important; height: 240px !important; min-height: 240px !important; max-width: none !important;
            border-bottom: 1px solid var(--border-color) !important; overflow: hidden !important;
            position: relative !important; flex-shrink: 0 !important; order: -1 !important; margin: 0 !important; padding: 0 !important;
        }
        .app-image { display: block !important; width: 100% !important; height: 100% !important; object-fit: cover !important; object-position: center !important; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; }
        .app-item:hover .app-image { transform: scale(1.08) !important; }
        .app-info { padding: 24px !important; display: flex !important; flex-direction: column !important; flex-grow: 1 !important; justify-content: flex-start !important; width: 100% !important; box-sizing: border-box !important; }
        .app-name {
            font-size: 1.4rem !important; font-weight: 700 !important; color: var(--text-light) !important;
            margin-bottom: 10px !important; display: block !important; white-space: nowrap !important;
            overflow: hidden !important; text-overflow: ellipsis !important;
        }
        .app-desc {
            font-size: 1rem !important; color: var(--text-muted) !important; line-height: 1.6 !important;
            display: -webkit-box !important; -webkit-line-clamp: 3 !important; line-clamp: 3 !important; -webkit-box-orient: vertical !important;
            overflow: hidden !important; flex-grow: 1 !important; margin: 0 !important;
        }

        /* --- Card Badges --- */
        .card-beta-badge {
            position: absolute !important; bottom: 12px !important; right: 12px !important; background: #e74c3c !important;
            color: white !important; font-size: 0.75rem !important; padding: 4px 8px !important; border-radius: 6px !important;
            font-weight: 700 !important; z-index: 5 !important; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4) !important;
        }
        .card-crossplay-badge {
            position: absolute !important; top: 12px !important; right: 12px !important; background: #9b59b6 !important;
            color: white !important; font-size: 0.85rem !important; padding: 6px 10px !important; border-radius: 6px !important;
            z-index: 5 !important; box-shadow: 0 4px 10px rgba(155, 89, 182, 0.4) !important;
        }
        .card-source-badge {
            position: absolute !important; bottom: 12px !important; left: 12px !important; font-size: 0.75rem !important;
            padding: 4px 8px !important; border-radius: 6px !important; font-weight: 700 !important; z-index: 5 !important;
            backdrop-filter: blur(4px) !important;
        }
        .card-source-badge.live { background: rgba(39, 174, 96, 0.2) !important; color: #2ecc71 !important; border: 1px solid rgba(39, 174, 96, 0.4) !important; }
        .card-source-badge.local { background: rgba(149, 165, 166, 0.2) !important; color: #bdc3c7 !important; border: 1px solid rgba(149, 165, 166, 0.4) !important; }

        /* --- Spinners & Empty States --- */
        .global-loader { text-align: center !important; font-size: 1.2rem !important; color: var(--primary) !important; padding: 40px !important; animation: pulse 1.5s infinite !important; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .img-loader {
            position: absolute !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 30px !important; height: 30px !important; border: 3px solid rgba(255,255,255,0.1) !important; border-top-color: var(--primary) !important;
            border-radius: 50% !important; animation: spin 1s linear infinite !important; z-index: 1 !important;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        #no-results {
            text-align: center !important; padding: 60px 20px !important; background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important; border-radius: var(--radius-lg) !important;
            max-width: 600px !important; margin: 40px auto !important; backdrop-filter: blur(10px) !important;
        }
        .not-found-image { max-width: 200px !important; margin-bottom: 20px !important; opacity: 0.8 !important; }

        /* --- Back to top & Footer --- */
        #go-top a {
            background: var(--primary) !important; color: #111 !important; border-radius: 50% !important;
            box-shadow: 0 4px 15px rgba(57, 181, 74, 0.4) !important; transition: var(--transition) !important;
        }
        #go-top a:hover { transform: scale(1.1) translateY(-5px) !important; box-shadow: 0 6px 20px rgba(57, 181, 74, 0.6) !important; }
        footer {
            border-top: 1px solid var(--border-color) !important; background: rgba(9, 9, 11, 0.9) !important;
            padding: 30px 0 !important; text-align: center !important; backdrop-filter: blur(10px) !important;
        }
        .github-link { color: var(--text-muted) !important; text-decoration: none !important; transition: color 0.2s ease !important; font-weight: 500 !important; }
        .github-link:hover { color: var(--primary) !important; }

        /* --- Responsive Overrides --- */
        @media only screen and (max-width: 900px) {
            .page-header { flex-direction: column !important; justify-content: center !important; align-items: center !important; gap: 20px !important; padding: 25px 20px !important; position: relative !important; pointer-events: auto !important; }
            .nav-left { display: flex !important; justify-content: center !important; flex-wrap: wrap !important; gap: 10px !important; width: 100% !important; }
            .lang-switch { justify-content: center !important; width: 100% !important; }
            .search-section { padding-top: 40px !important; }

            .app-list { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important; gap: 20px !important; }
            .app-item { flex-direction: column !important; text-align: left !important; padding: 0 !important; width: 100% !important; }
            .app-info { padding: 20px !important; }
            .image-container { height: 200px !important; min-height: 200px !important; max-width: none !important; width: 100% !important; }
            .app-list li { width: 100% !important; }
        }
    </style>

            <script src="js/utils.js"></script>

    <section class="search-section">

                        <h1 id="pageHeading" style="margin: 0;">Suche</h1>

                    </div>
                    <div class="search-input-wrapper">
                        <input type="text" id="searchInput" placeholder="..." autocomplete="off" aria-label="Suche">
                        <i id="clearSearch" class="fa fa-times" aria-hidden="true" style="display: none;"></i>
                    </div>
                    <div class="filter-chips">
                        <button id="filterBtnAll" class="filter-chip active" data-filter="">Alle</button>
                        <button id="filterBtnNew" class="filter-chip" data-filter="f:new">Neu</button>
                        <button id="filterBtnCrossplay" class="filter-chip custom-tooltip-container" data-filter="f:crossplay"><i class="fa fa-gamepad" aria-hidden="true"></i> <span id="filterBtnCrossplayText">Crossplay</span> <i class="fa fa-info-circle" aria-hidden="true" style="margin-left: 4px; font-size: 0.85em; opacity: 0.8;"></i><span class="custom-tooltip-text" id="filterBtnCrossplayTooltip">Crossplay über den DDE Server möglich (PC, Xbox, PSN/PS4/PS5, etc.). Info: Es kann zu Fehlern kommen!</span></button>

                    </div>
                    <p id="resultCount" class="result-count"></p>
                </div>

                <div id="globalLoader" class="global-loader">Lade Apps...</div>
                <ul id="appList" class="app-list">
                </ul>
                
                <div id="no-results">
                    <img src="images/notf.webp" alt="Not Found" class="not-found-image">
                    <p>Keine Spiele gefunden.</p>
                </div>
    </section>
